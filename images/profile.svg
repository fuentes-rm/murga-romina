<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Romina Murga Avatar">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="55%" stop-color="#2b547e" />
      <stop offset="100%" stop-color="#1b4353" />
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)" />
  <rect width="400" height="400" fill="url(#glow)" />

  <!-- Subtle molecular / nanoparticle ring motif -->
  <circle cx="200" cy="200" r="156" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />
  <circle cx="200" cy="200" r="142" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 6" />
  <circle cx="310" cy="90" r="5" fill="#90cdf4" fill-opacity="0.45" />
  <circle cx="84" cy="296" r="4" fill="#90cdf4" fill-opacity="0.35" />
  <circle cx="328" cy="278" r="3.5" fill="#90cdf4" fill-opacity="0.3" />

  <!-- Monogram -->
  <text x="200" y="216"
        text-anchor="middle"
        dominant-baseline="middle"
        fill="#ffffff"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="124"
        font-weight="600"
        letter-spacing="4">RM</text>
</svg>
